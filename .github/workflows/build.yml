name: 'Build Corne v4 Firmware'

on:
  - push
  - workflow_dispatch

jobs:
  build:
    uses: ./.github/workflows/main.yml
    with:
      # This is the corrected line. We are now passing a string
      # that looks like a JSON array, which the workflow expects.
      keyboard: '["crkbd/rev1"]'
      
      # This part remains correct and is essential for getting the .uf2 file.
      custom_config: '{ "MIRYOKU_ALPHAS": "colemak_dh", "MIRYOKU_BOOTLOADER": "rp2040" }'
