name: 'Build Corne v4 (RP2040) Firmware'

on:
  - push
  - workflow_dispatch

jobs:
  build:
    uses: ./.github/workflows/main.yml
    with:
      # This is still the correct identifier for all Corne keyboards.
      keyboard: 'crkbd/rev1'
      
      # This is the crucial part. We add "MIRYOKU_BOOTLOADER" to the custom config.
      # This explicitly tells the build system to compile for the RP2040
      # and generate the .uf2 file you need.
      custom_config: '{ "MIRYOKU_ALPHAS": "colemak_dh", "MIRYOKU_BOOTLOADER": "rp2040" }'
