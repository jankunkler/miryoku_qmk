name: Build Miryoku Corne
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: List available crkbd versions
      run: |
        echo "Available crkbd keyboards:"
        find keyboards/crkbd -type d -name "rev*" | sort

    - name: Setup QMK
      run: |
        python3 -m pip install --upgrade qmk

    - name: QMK Setup  
      run: |
        qmk setup -y

    - name: Build firmware for rev1
      run: |
        qmk compile -kb crkbd/rev1 -km manna-harbour_miryoku

    - name: Archive firmware
      uses: actions/upload-artifact@v4
      with:
        name: crkbd-miryoku-firmware
        path: |
          *.hex
          *.bin
          *.uf2
