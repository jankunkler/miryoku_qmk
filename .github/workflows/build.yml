name: 'Build Corne v4 Firmware'

on:
  - push
  - workflow_dispatch

jobs:
  build:
    # This calls the main Miryoku workflow.
    uses: ./.github/workflows/main.yml
    with:
      # This still needs to be a JSON array string.
      keyboard: '["crkbd/rev1"]'
      
      # This is the new, correct method.
      # We are passing the configuration defines directly to the compiler.
      extra_cmake_options: '-DMIRYOKU_BOOTLOADER=rp2040 -DMIRYOKU_ALPHAS=colemak_dh'
