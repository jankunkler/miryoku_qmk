name: Build Miryoku Corne
on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Build firmware
      run: |
        make crkbd/rev4_1:manna-harbour_miryoku

    - name: Archive firmware
      uses: actions/upload-artifact@v3
      with:
        name: crkbd-miryoku-firmware
        path: |
          *.hex
          *.bin
          *.uf2
